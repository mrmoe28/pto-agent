<!DOCTYPE html>
<html>
<head>
    <title>Google APIs Debug</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAr5knif73PEUZK4nQjGg0-2Bbw6-aIHbo&libraries=places&callback=initMap" async defer></script>
</head>
<body>
    <h1>Google APIs Debug</h1>
    <div>
        <label for="address">Address:</label>
        <input type="text" id="address" placeholder="Enter address..." style="width: 300px; padding: 10px;">
    </div>
    <div id="results" style="margin-top: 20px;"></div>

    <script>
        function initMap() {
            console.log('Google Maps API loaded successfully');
            
            const input = document.getElementById('address');
            const results = document.getElementById('results');
            
            const autocomplete = new google.maps.places.Autocomplete(input, {
                types: ['address'],
                fields: ['formatted_address', 'geometry', 'address_components', 'place_id'],
                componentRestrictions: { country: 'us' }
            });
            
            autocomplete.addListener('place_changed', function() {
                const place = autocomplete.getPlace();
                console.log('Place selected:', place);
                
                if (place && place.formatted_address) {
                    results.innerHTML = `
                        <h3>Selected Place:</h3>
                        <p><strong>Address:</strong> ${place.formatted_address}</p>
                        <p><strong>Place ID:</strong> ${place.place_id || 'N/A'}</p>
                        <p><strong>Geometry:</strong> ${place.geometry ? 'Available' : 'Not available'}</p>
                        <p><strong>Address Components:</strong> ${place.address_components ? place.address_components.length + ' components' : 'Not available'}</p>
                    `;
                } else {
                    results.innerHTML = '<p style="color: red;">No place selected or invalid place data</p>';
                }
            });
            
            // Test geocoding
            const geocoder = new google.maps.Geocoder();
            document.getElementById('address').addEventListener('blur', function() {
                const address = this.value;
                if (address) {
                    geocoder.geocode({ address: address }, function(results, status) {
                        console.log('Geocoding result:', status, results);
                        if (status === 'OK' && results[0]) {
                            const result = results[0];
                            document.getElementById('results').innerHTML += `
                                <h3>Geocoding Result:</h3>
                                <p><strong>Status:</strong> ${status}</p>
                                <p><strong>Address:</strong> ${result.formatted_address}</p>
                                <p><strong>Location:</strong> ${result.geometry.location.lat()}, ${result.geometry.location.lng()}</p>
                            `;
                        } else {
                            document.getElementById('results').innerHTML += `
                                <h3>Geocoding Result:</h3>
                                <p style="color: red;"><strong>Status:</strong> ${status}</p>
                                <p style="color: red;"><strong>Error:</strong> Could not geocode address</p>
                            `;
                        }
                    });
                }
            });
        }
        
        window.addEventListener('error', function(e) {
            console.error('JavaScript error:', e.error);
            document.getElementById('results').innerHTML += `
                <p style="color: red;">JavaScript Error: ${e.error.message}</p>
            `;
        });
    </script>
</body>
</html>
