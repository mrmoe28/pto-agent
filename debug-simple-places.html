<!DOCTYPE html>
<html>
<head>
    <title>Simple Google Places Test</title>
    <script>
        function testGoogleAPI() {
            console.log('Testing Google API loading...');
            
            // Check if API key is available
            const apiKey = 'AIzaSyAr5knif73PEUZK4nQjGg0-2Bbw6-aIHbo';
            console.log('API Key:', apiKey ? 'Present' : 'Missing');
            
            // Load the Google Maps API
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=places&callback=initMap`;
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
        }
        
        function initMap() {
            console.log('Google Maps API loaded successfully');
            console.log('google object:', typeof google);
            console.log('google.maps:', typeof google?.maps);
            console.log('google.maps.places:', typeof google?.maps?.places);
            
            if (typeof google !== 'undefined' && google.maps && google.maps.places) {
                console.log('✅ Google Places API is available');
                
                // Test creating an autocomplete
                const input = document.getElementById('address');
                if (input) {
                    try {
                        const autocomplete = new google.maps.places.Autocomplete(input, {
                            types: ['address'],
                            componentRestrictions: { country: 'us' }
                        });
                        console.log('✅ Autocomplete created successfully');
                        
                        autocomplete.addListener('place_changed', function() {
                            const place = autocomplete.getPlace();
                            console.log('Place selected:', place);
                            document.getElementById('result').innerHTML = 
                                `<p>Selected: ${place.formatted_address || 'No address'}</p>`;
                        });
                    } catch (error) {
                        console.error('❌ Error creating autocomplete:', error);
                    }
                }
            } else {
                console.error('❌ Google Places API not available');
            }
        }
        
        // Start the test when page loads
        window.onload = testGoogleAPI;
    </script>
</head>
<body>
    <h1>Simple Google Places Test</h1>
    <input type="text" id="address" placeholder="Type an address..." style="width: 400px; padding: 10px; margin: 10px;">
    <div id="result" style="margin: 10px; padding: 10px; border: 1px solid #ccc;"></div>
    <div id="console" style="margin: 10px; padding: 10px; background: #f0f0f0; font-family: monospace; white-space: pre-wrap;"></div>
    
    <script>
        // Capture console logs
        const originalLog = console.log;
        const originalError = console.error;
        const consoleDiv = document.getElementById('console');
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            consoleDiv.textContent += 'LOG: ' + args.join(' ') + '\n';
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            consoleDiv.textContent += 'ERROR: ' + args.join(' ') + '\n';
        };
    </script>
</body>
</html>
